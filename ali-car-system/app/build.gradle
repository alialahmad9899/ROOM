plugins { id 'com.android.application' }

def dashboardSource = file("src/main/assets/dashboard.webp")
def dashboardWallpaper = file("src/main/res/drawable-nodpi/bg_car_dashboard.webp")

tasks.register("materializeDashboardWallpaper") {
    inputs.file(dashboardSource)
    outputs.file(dashboardWallpaper)
    doLast {
        if (!dashboardSource.isFile()) {
            throw new GradleException("Missing supplied ALI CAR highway background: " + dashboardSource)
        }
        byte[] image = dashboardSource.bytes
        if (image.length < 1000
                || new String(image, 0, 4, "US-ASCII") != "RIFF"
                || new String(image, 8, 4, "US-ASCII") != "WEBP") {
            throw new GradleException("Supplied dashboard background is not a valid WebP container")
        }
        dashboardWallpaper.parentFile.mkdirs()
        dashboardWallpaper.bytes = image
        logger.lifecycle("Installed supplied ALI CAR highway photograph from assets/dashboard.webp: " + image.length + " bytes")
    }
}

android {
    namespace 'com.ali.carsystem'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ali.carsystem'
        minSdk 21
        targetSdk 22
        versionCode 12
        versionName '2.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/LICENSE.txt',
                         'META-INF/NOTICE','META-INF/NOTICE.txt']
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("materializeDashboardWallpaper")
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
