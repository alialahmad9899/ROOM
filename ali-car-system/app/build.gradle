plugins { id 'com.android.application' }

android {
    namespace 'com.ali.carsystem'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ali.carsystem'
        minSdk 21
        targetSdk 22
        versionCode 3
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }
}

dependencies {
    // Archived upstream, but this last stable release supports legacy Android devices.
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
