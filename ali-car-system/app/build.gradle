plugins { id 'com.android.application' }

android {
    namespace 'com.ali.carsystem'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ali.carsystem'
        minSdk 21
        targetSdk 22
        versionCode 350
        versionName '3.5.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildTypes {
        debug { applicationIdSuffix ''; versionNameSuffix '-clean' }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions { animationsDisabled = true }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    // Google Fused Location Provider supports the device's Android 5 / API 21 baseline.
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    // Legacy ExoPlayer remains compatible with Android 5 / API 21.
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
