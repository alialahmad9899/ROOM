plugins { id 'com.android.application' }

android {
    namespace 'com.ali.carsystem'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ali.carsystem'
        minSdk 21
        targetSdk 22
        versionCode 2
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
