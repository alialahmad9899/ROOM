plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wesal.carlauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wesal.carlauncher'
        minSdk 21
        targetSdk 22
        versionCode 3
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
