plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wesal.carlauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wesal.carlauncher'
        minSdk 21
        targetSdk 22
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
