name: Inspect ASUS Z170CG Kernel Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-kernel-source.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  inspect-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and inspect public release archive safely
        env:
          DOWNLOAD_URL: https://github.com/alialahmad9899/ROOM/releases/download/kernel-source-v1/Z170_V12_26_4_69_Kernal.zip
          EXPECTED_SHA256: 1005cb54e93c9ffd49146c7d0add0054db633eb980b5cec9b4cd195a888b8c0a
          EXPECTED_SIZE: "129001094"
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, urllib.request, zipfile

          out = pathlib.Path("inspection")
          out.mkdir(exist_ok=True)
          archive = pathlib.Path("kernel-source.zip")
          request = urllib.request.Request(
              os.environ["DOWNLOAD_URL"],
              headers={"User-Agent": "ASUS-Z170CG-kernel-inspector"},
          )
          digest = hashlib.sha256()
          size = 0
          with urllib.request.urlopen(request, timeout=180) as response, archive.open("wb") as target:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  target.write(chunk)
                  digest.update(chunk)
                  size += len(chunk)

          sha256 = digest.hexdigest()
          expected_size = int(os.environ["EXPECTED_SIZE"])
          expected_hash = os.environ["EXPECTED_SHA256"]
          lines = [
              "ASUS Z170CG / P01Y Kernel Source Inspection",
              f"Asset: {archive.name}",
              f"Downloaded size: {size}",
              f"Expected size: {expected_size}",
              f"SHA-256: {sha256}",
              f"Expected SHA-256: {expected_hash}",
              f"Size matches: {size == expected_size}",
              f"SHA-256 matches: {sha256 == expected_hash}",
              "",
          ]
          if size != expected_size or sha256 != expected_hash:
              raise SystemExit("\n".join(lines) + "\nArchive integrity verification failed.")

          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC check failed at: {bad}")
              infos = z.infolist()
              names = [i.filename for i in infos if not i.is_dir()]
              total_uncompressed = sum(i.file_size for i in infos)
              lines += [
                  "ZIP CRC test: passed",
                  f"File entries: {len(names)}",
                  f"Uncompressed bytes: {total_uncompressed}",
                  "",
                  "Top-level entries:",
              ]
              tops = sorted({n.split("/", 1)[0] for n in names})
              lines.extend(f"  - {x}" for x in tops[:100])

              candidates = [
                  n for n in names
                  if n == "Makefile" or n.endswith("/Makefile")
                  or n.endswith("/include/linux/version.h")
                  or n.endswith("/include/generated/utsrelease.h")
                  or n.endswith("/README") or n.endswith("/README.md")
                  or n.endswith("/README.txt")
              ]
              lines += ["", "Kernel metadata candidates:"]
              lines.extend(f"  - {x}" for x in candidates[:150])

              versions = []
              for name in candidates:
                  if name.endswith("Makefile") and name.count("/") <= 2:
                      try:
                          data = z.read(name)[:200000].decode("utf-8", "replace")
                      except Exception:
                          continue
                      fields = {}
                      for key in ("VERSION", "PATCHLEVEL", "SUBLEVEL", "EXTRAVERSION"):
                          match = re.search(r"(?m)^\s*" + key + r"\s*=\s*(.*?)\s*$", data)
                          if match:
                              fields[key] = match.group(1)
                      if fields:
                          versions.append({"path": name, "fields": fields})

              indicators = {
                  "arch/x86": sum(n.startswith("arch/x86/") for n in names),
                  "arch/arm": sum(n.startswith("arch/arm/") for n in names),
                  "drivers/gpu": sum(n.startswith("drivers/gpu/") for n in names),
                  "drivers/input": sum(n.startswith("drivers/input/") for n in names),
                  "drivers/bluetooth": sum(n.startswith("drivers/bluetooth/") for n in names),
                  "drivers/media": sum(n.startswith("drivers/media/") for n in names),
              }
              lines += [
                  "",
                  "Version fields found:",
                  json.dumps(versions, indent=2),
                  "",
                  "Path indicators (counts):",
                  json.dumps(indicators, indent=2),
              ]

          (out / "kernel-inspection.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          (out / "archive-manifest.txt").write_text("\n".join(names) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: asus-z170cg-kernel-inspection
          path: inspection/
          if-no-files-found: error
          retention-days: 14
