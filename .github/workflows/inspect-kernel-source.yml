name: Inspect ASUS Z170CG Kernel Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-kernel-source.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  inspect-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download, verify, and inspect nested kernel source archive
        env:
          DOWNLOAD_URL: https://github.com/alialahmad9899/ROOM/releases/download/kernel-source-v1/Z170_V12_26_4_69_Kernal.zip
          EXPECTED_SHA256: 1005cb54e93c9ffd49146c7d0add0054db633eb980b5cec9b4cd195a888b8c0a
          EXPECTED_SIZE: "129001094"
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, tarfile, zipfile

          out = pathlib.Path("inspection")
          out.mkdir(exist_ok=True)
          archive = pathlib.Path("kernel-source.zip")
          nested = pathlib.Path("kernel-source.tar.gz")

          request = __import__("urllib.request").request.Request(
              os.environ["DOWNLOAD_URL"],
              headers={"User-Agent": "ASUS-Z170CG-kernel-inspector"},
          )
          digest = hashlib.sha256()
          size = 0
          with __import__("urllib.request").request.urlopen(request, timeout=240) as response, archive.open("wb") as target:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  target.write(chunk)
                  digest.update(chunk)
                  size += len(chunk)

          sha256 = digest.hexdigest()
          expected_size = int(os.environ["EXPECTED_SIZE"])
          expected_hash = os.environ["EXPECTED_SHA256"]
          lines = [
              "ASUS Z170CG / P01Y nested kernel source inspection",
              f"Downloaded ZIP bytes: {size}",
              f"Expected ZIP bytes: {expected_size}",
              f"SHA-256: {sha256}",
              f"Expected SHA-256: {expected_hash}",
              f"Size matches: {size == expected_size}",
              f"SHA-256 matches: {sha256 == expected_hash}",
              "",
          ]
          if size != expected_size or sha256 != expected_hash:
              raise SystemExit("\\n".join(lines) + "\\nArchive integrity verification failed.")

          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC test failed: {bad}")
              files = [i for i in z.infolist() if not i.is_dir()]
              if len(files) != 1:
                  raise SystemExit(f"Expected one nested source archive, found {len(files)}")
              nested_info = files[0]
              lines += [
                  f"Outer ZIP CRC: passed",
                  f"Nested archive path: {nested_info.filename}",
                  f"Nested archive uncompressed size: {nested_info.file_size}",
              ]
              with z.open(nested_info) as src, nested.open("wb") as dst:
                  while True:
                      chunk = src.read(1024 * 1024)
                      if not chunk:
                          break
                      dst.write(chunk)

          with tarfile.open(nested, mode="r:gz") as tf:
              members = tf.getmembers()
              regular = [m for m in members if m.isfile()]
              names = [m.name.lstrip("./") for m in regular]
              normalized = [(m, m.name.lstrip("./")) for m in regular]
              tops = sorted({n.split("/", 1)[0] for n in names if n})
              lines += [
                  "",
                  "INNER TAR.GZ:",
                  "Read test: passed",
                  f"Total members: {len(members)}",
                  f"Regular files: {len(regular)}",
                  f"Uncompressed regular-file bytes: {sum(m.size for m in regular)}",
                  "Top-level entries:",
              ]
              lines.extend(f"  - {n}" for n in tops[:120])

              relevant = []
              for m, n in normalized:
                  base = n.rsplit("/", 1)[-1]
                  depth = n.count("/")
                  low = n.lower()
                  if (
                      (base == "Makefile" and depth <= 3)
                      or base.lower().startswith("readme")
                      or base.endswith("defconfig")
                      or base in {"Kconfig", "Kconfig.cpu", "build.sh", "build_kernel.sh", "Android.mk", "BoardConfig.mk"}
                      or any(k in low for k in ("z170", "p01y", "sofia", "3230", "atom", "intel_mid"))
                  ):
                      relevant.append((m, n))
              lines += ["", f"Relevant source paths ({len(relevant)} found; first 800):"]
              lines.extend(f"  - {n} [{m.size} bytes]" for m, n in relevant[:800])

              candidates = []
              for m, n in normalized:
                  base = n.rsplit("/", 1)[-1]
                  low = n.lower()
                  if (
                      base == "Makefile" and n.count("/") <= 3
                      or base.lower().startswith("readme") and m.size <= 200000
                      or base.endswith("defconfig") and m.size <= 500000
                      or n.endswith(("arch/x86/Kconfig", "arch/x86/Kconfig.cpu", "include/linux/version.h", "include/generated/utsrelease.h"))
                      or any(k in low for k in ("z170", "p01y", "sofia", "3230", "intel_mid"))
                  ):
                      candidates.append((m, n))
              candidates = candidates[:120]
              lines += ["", "SELECTED FILE CONTENTS (bounded):"]
              for m, n in candidates:
                  if m.size > 500000:
                      continue
                  try:
                      fh = tf.extractfile(m)
                      data = fh.read(500000).decode("utf-8", "replace") if fh else ""
                  except Exception as e:
                      lines.append(f"\n===== {n} (read error: {e}) =====")
                      continue
                  if not data.strip():
                      continue
                  lines.append(f"\n===== {n} ({m.size} bytes; showing up to 500KB) =====")
                  lines.append(data[:12000])

              (out / "kernel-inspection.txt").write_text("\\n".join(lines) + "\\n", encoding="utf-8")
              (out / "relevant-source-paths.txt").write_text("\\n".join(f"{n} [{m.size}]" for m, n in relevant) + "\\n", encoding="utf-8")
              print("\\n".join(lines[:220]))
          PY

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: asus-z170cg-kernel-deep-inspection
          path: inspection/
          if-no-files-found: error
          retention-days: 14
