name: Inspect ASUS Z170CG Kernel Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-kernel-source.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  inspect-android-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Inventory Android source layout and find device build definitions
        env:
          DOWNLOAD_URL: https://github.com/alialahmad9899/ROOM/releases/download/kernel-source-v1/Z170_V12_26_4_69_Kernal.zip
          EXPECTED_SHA256: 1005cb54e93c9ffd49146c7d0add0054db633eb980b5cec9b4cd195a888b8c0a
          EXPECTED_SIZE: "129001094"
        run: |
          python3 - <<'PY'
          import collections, hashlib, os, pathlib, re, tarfile, urllib.request, zipfile
          out = pathlib.Path("inspection")
          out.mkdir(exist_ok=True)
          zpath = pathlib.Path("source.zip")
          tpath = pathlib.Path("source.tar.gz")
          req = urllib.request.Request(os.environ["DOWNLOAD_URL"], headers={"User-Agent":"ROOM-layout-inspector"})
          h=hashlib.sha256(); size=0
          with urllib.request.urlopen(req,timeout=240) as r,zpath.open("wb") as w:
              while c:=r.read(1024*1024):
                  w.write(c); h.update(c); size+=len(c)
          if size!=int(os.environ["EXPECTED_SIZE"]) or h.hexdigest()!=os.environ["EXPECTED_SHA256"]:
              raise SystemExit("Original archive integrity mismatch")
          with zipfile.ZipFile(zpath) as z:
              bad=z.testzip()
              if bad: raise SystemExit("ZIP CRC failed: "+bad)
              fs=[x for x in z.infolist() if not x.is_dir()]
              if len(fs)!=1: raise SystemExit(f"Unexpected outer ZIP entries: {len(fs)}")
              with z.open(fs[0]) as src,tpath.open("wb") as dst:
                  while c:=src.read(1024*1024): dst.write(c)

          lines=["ASUS Z170CG SOURCE TREE LAYOUT","Archive verified: yes",f"SHA-256: {h.hexdigest()}",""]
          with tarfile.open(tpath,"r:gz") as tf:
              ms=[m for m in tf.getmembers() if m.isfile()]
              names=[m.name.lstrip("./") for m in ms]
              by={m.name.lstrip("./"):m for m in ms}
              root=collections.Counter(n.split("/",1)[0] for n in names if n)
              lines += ["TOP LEVEL FILE COUNTS:"]
              lines += [f"{k}: {v}" for k,v in sorted(root.items())]
              second=collections.Counter("/".join(n.split("/")[:2]) for n in names if n.startswith("mydroid/") and len(n.split("/"))>1)
              lines += ["","MYDROID SECOND-LEVEL FILE COUNTS:"]
              lines += [f"{k}: {v}" for k,v in sorted(second.items())[:300]]
              exact=[n for n in names if n.rsplit("/",1)[-1] in {"AndroidProducts.mk","BoardConfig.mk","device.mk","vendorsetup.sh","Android.mk","build.gradle","product.mk","main.mk","envsetup.sh"}]
              lines += ["",f"BUILD FILE PATHS ({len(exact)}):"] + exact[:2500]
              roots=[n for n in names if n in {"mydroid/build/core/main.mk","mydroid/build/envsetup.sh","mydroid/Makefile","mydroid/README","mydroid/README.md","linux-3.10/arch/x86/configs/i386_sofia_defconfig","linux-3.10/arch/x86/configs/x86_64_sofia_defconfig"}]
              lines += ["","KEY ROOT BUILD FILE PRESENCE:"] + [("FOUND " if n in by else "MISSING ")+n for n in ["mydroid/build/core/main.mk","mydroid/build/envsetup.sh","mydroid/Makefile","linux-3.10/arch/x86/configs/i386_sofia_defconfig","linux-3.10/arch/x86/configs/x86_64_sofia_defconfig"]]
              rx=re.compile(r"Z170CG|P01Y|SF_3GR|sofia_3gr|PRODUCT_DEVICE|TARGET_PRODUCT|TARGET_ARCH|BOARD_KERNEL",re.I)
              matches=[]; checked=0
              for m in ms:
                  n=m.name.lstrip("./")
                  if not n.startswith("mydroid/") or m.size>700000: continue
                  ext=n.rsplit(".",1)[-1].lower() if "." in n else ""
                  if ext not in {"mk","bp","xml","sh","prop","txt","json","product"," BoardConfig".strip().lower()} and not n.endswith("/Makefile"): continue
                  if not any(k in n.lower() for k in ("device","vendor","product","board","target","build","asus","sofia","p01y","z170","manifest")): continue
                  try:
                      f=tf.extractfile(m)
                      data=f.read(700000).decode("utf-8","replace") if f else ""
                  except Exception: continue
                  checked+=1
                  hits=[f"{i+1}: {line.strip()[:260]}" for i,line in enumerate(data.splitlines()) if rx.search(line)]
                  if hits: matches.append((n,hits[:40]))
              lines += ["",f"PROJECT IDENTIFIER SEARCH: scanned {checked} likely Android build/config files; matched {len(matches)} files."]
              for n,hits in matches[:200]:
                  lines += ["",f"===== {n} ====="]+hits
              # Capture full small board product/build definitions and configs for inspection.
              capture=[]
              nameset=set(exact)
              for n in exact:
                  if n.startswith("mydroid/") and (n.endswith(("AndroidProducts.mk","BoardConfig.mk","device.mk","vendorsetup.sh")) or any(k in n.lower() for k in ("asus","p01y","z170","sofia"))):
                      m=by[n]
                      if m.size<=150000:
                          f=tf.extractfile(m); data=f.read().decode("utf-8","replace") if f else ""
                          capture += ["",f"===== CONTENT {n} =====",data[:10000]]
              lines += ["","RELEVANT FILE CONTENTS:"]+capture[:1200]
              (out/"android-layout-report.txt").write_text("\n".join(lines)+"\n",encoding="utf-8")
              print("\n".join(lines[:240]))
          PY

      - name: Upload Android layout report
        uses: actions/upload-artifact@v4
        with:
          name: asus-z170cg-android-layout
          path: inspection/
          if-no-files-found: error
          retention-days: 14
