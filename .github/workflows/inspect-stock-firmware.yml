name: Inspect ASUS Z170CG Stock Firmware

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-stock-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-stock-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download, verify, and inspect OTA image metadata
        env:
          DOWNLOAD_URL: https://github.com/alialahmad9899/ROOM/releases/download/stock-firmware-v1/UL-P01Y-WW-12.26.4.69-user_2.zip
          EXPECTED_SHA256: a3cff1f6703cb68cbe189fc029ab0a94fd7a3ab85297cfdd271fe3e7ff16a6a2
          EXPECTED_SIZE: "1121160179"
        run: |
          python3 - <<'PY'
          import collections, hashlib, os, pathlib, re, struct, subprocess, urllib.request, zipfile

          out = pathlib.Path("firmware-inspection")
          out.mkdir(exist_ok=True)
          archive = pathlib.Path("stock-firmware-original.zip")
          request = urllib.request.Request(os.environ["DOWNLOAD_URL"], headers={"User-Agent":"ROOM-Z170CG-OTA-inspector"})
          digest = hashlib.sha256()
          size = 0
          with urllib.request.urlopen(request, timeout=600) as response, archive.open("wb") as target:
              while True:
                  chunk = response.read(4 * 1024 * 1024)
                  if not chunk:
                      break
                  target.write(chunk)
                  digest.update(chunk)
                  size += len(chunk)

          expected_size = int(os.environ["EXPECTED_SIZE"])
          actual_hash = digest.hexdigest()
          expected_hash = os.environ["EXPECTED_SHA256"]
          lines = [
              "ASUS Z170CG / P01Y OTA PACKAGE ANALYSIS",
              f"Downloaded bytes: {size}",
              f"Expected bytes: {expected_size}",
              f"SHA-256: {actual_hash}",
              f"Expected SHA-256: {expected_hash}",
              f"Size matches: {size == expected_size}",
              f"SHA-256 matches: {actual_hash == expected_hash}",
              "",
          ]
          if size != expected_size or actual_hash != expected_hash:
              raise SystemExit("Original firmware archive integrity verification failed.")

          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Outer ZIP CRC test failed: {bad}")
              infos = [i for i in z.infolist() if not i.is_dir()]
              inventory = [f"{i.filename} | compressed={i.compress_size} | expanded={i.file_size}" for i in infos]
              lines += ["OUTER ZIP CRC: passed", "OUTER ZIP CONTENTS:"] + inventory

              def read_small(name, limit=2*1024*1024):
                  try:
                      info = z.getinfo(name)
                  except KeyError:
                      return None
                  if info.file_size > limit:
                      return None
                  with z.open(info) as f:
                      return f.read(limit)

              script = read_small("META-INF/com/google/android/updater-script")
              if script:
                  lines += ["", "OTA UPDATER SCRIPT:", script.decode("utf-8","replace")]

              transfer = read_small("system.transfer.list")
              new_info = z.getinfo("system.new.dat")
              fwu_info = z.getinfo("fwu_image.bin")
              lines += [
                  "",
                  "SYSTEM DATA:",
                  f"system.new.dat uncompressed-in-outer-zip bytes: {new_info.file_size}",
                  f"system.new.dat compressed-in-outer-zip bytes: {new_info.compress_size}",
                  f"system.new.dat first 64 bytes: {z.open(new_info).read(64).hex(' ')}",
                  "",
                  "FWU IMAGE:",
                  f"fwu_image.bin bytes: {fwu_info.file_size}",
                  f"fwu_image.bin first 256 bytes: {z.open(fwu_info).read(256).hex(' ')}",
              ]

              if transfer:
                  text = transfer.decode("utf-8","replace")
                  (out/"system.transfer.list").write_text(text,encoding="utf-8")
                  rows = text.splitlines()
                  lines += ["", "SYSTEM TRANSFER LIST (complete):", text]
                  try:
                      version = int(rows[0].strip())
                      total_blocks = int(rows[1].strip())
                      cursor = 2
                      stash_entries = int(rows[cursor].strip()) if version >= 2 else 0
                      cursor += 1 if version >= 2 else 0
                      max_stash = int(rows[cursor].strip()) if version >= 3 else 0
                      cursor += 1 if version >= 3 else 0
                      commands = rows[cursor:]
                      counts = collections.Counter(row.split(" ",1)[0] for row in commands if row.strip())
                      lines += [
                          "",
                          "TRANSFER LIST SUMMARY:",
                          f"Version: {version}",
                          f"Target blocks: {total_blocks}",
                          f"Target bytes at 4096 bytes/block: {total_blocks*4096}",
                          f"Stash entries: {stash_entries}",
                          f"Maximum stash entries: {max_stash}",
                          f"Command counts: {dict(counts)}",
                      ]

                      supported = {"new","zero","erase"}
                      if counts and set(counts).issubset(supported) and version <= 4:
                          image = pathlib.Path("system-reconstructed.img")
                          data_pos = 0
                          written_blocks = 0
                          with z.open(new_info) as dat, image.open("wb") as img:
                              img.truncate(total_blocks*4096)
                              for row in commands:
                                  if not row.strip():
                                      continue
                                  command, *args = row.split(" ",1)
                                  if command != "new":
                                      continue
                                  ranges = [int(x) for x in args[0].split(",")]
                                  pair_count = ranges[0]
                                  if len(ranges) != 1 + pair_count*2:
                                      raise SystemExit(f"Malformed transfer range: {row}")
                                  for idx in range(pair_count):
                                      start = ranges[1+idx*2]
                                      end = ranges[2+idx*2]
                                      if end < start or end > total_blocks:
                                          raise SystemExit(f"Invalid block range in transfer list: {row}")
                                      byte_count = (end-start)*4096
                                      img.seek(start*4096)
                                      remaining = byte_count
                                      while remaining:
                                          chunk = dat.read(min(4*1024*1024,remaining))
                                          if not chunk:
                                              raise SystemExit("system.new.dat ended before transfer-list ranges were fulfilled")
                                          img.write(chunk)
                                          remaining -= len(chunk)
                                      data_pos += byte_count
                                      written_blocks += (end-start)
                          lines += [
                              "",
                              "SYSTEM IMAGE RECONSTRUCTION:",
                              "Status: completed from new/zero/erase-only transfer commands",
                              f"Reconstructed file bytes: {image.stat().st_size}",
                              f"New data bytes consumed: {data_pos}",
                              f"New blocks written: {written_blocks}",
                              f"Ext4 superblock magic at offset 1080: {image.open('rb').read()[1080:1082].hex()}",
                          ]
                          if shutil_which := __import__("shutil").which("debugfs"):
                              for target in ("/build.prop","/system/build.prop"):
                                  p = subprocess.run([shutil_which,"-R",f"cat {target}",str(image)],capture_output=True,text=True,timeout=60)
                                  if p.returncode == 0 and p.stdout.strip():
                                      (out/"system-build.prop").write_text(p.stdout,encoding="utf-8")
                                      selected = [x for x in p.stdout.splitlines() if re.match(r"^(ro\\.build\\.|ro\\.product\\.|ro\\.hardware|ro\\.product\\.cpu\\.abi|ro\\.build\\.version\\.)",x,re.I)]
                                      lines += ["",f"BUILD.PROP READ FROM {target}:"]+selected[:500]
                                      break
                              else:
                                  lines += ["", "BUILD.PROP: not found at root candidates through debugfs"]
                      else:
                          lines += [
                              "",
                              "SYSTEM IMAGE RECONSTRUCTION:",
                              "Status: skipped; transfer list uses commands requiring original source blocks or patch/stash processing, or unsupported version.",
                              f"Observed command names: {sorted(counts)}",
                          ]
                  except Exception as e:
                      lines += ["", "TRANSFER LIST PARSE / RECONSTRUCTION ERROR:", repr(e)]

              (out/"stock-firmware-analysis.txt").write_text("\n".join(lines)+"\n",encoding="utf-8")
              print("\n".join(lines[:300]))
          PY

      - name: Upload detailed firmware analysis
        uses: actions/upload-artifact@v4
        with:
          name: asus-z170cg-stock-firmware-detailed-analysis
          path: firmware-inspection/
          if-no-files-found: error
          retention-days: 14
