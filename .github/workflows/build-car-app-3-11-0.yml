name: ALI CAR 3.12.0 Comprehensive Repair API21 x86

on:
  push:
    branches: ["ali-car-system/3.12.0-full-repair-2026-11-20"]
    paths: ["ali-car-system/**","tools/rom/**","tools/maps/**",".github/workflows/build-car-app-3-11-0.yml"]
  workflow_dispatch:

concurrency:
  group: ali-car-system-api21-x86-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  android-api21-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Upload user-provided visual references for inspection
        uses: actions/upload-artifact@v7
        with:
          name: ALI-CAR-USER-REFERENCES
          path: |
            111.jfif
            222.jpg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Android build and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip git ffmpeg
          python -m pip install --disable-pip-version-check Pillow

      - name: Build BRouter offline car-routing engine
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/offline-map-build"
          git clone --depth 1 --branch v1.7.10 https://github.com/abrensch/brouter.git "$GITHUB_WORKSPACE/offline-map-build/brouter"
          cd "$GITHUB_WORKSPACE/offline-map-build/brouter"
          ./gradlew --no-daemon :brouter-server:smallJar
          JAR="$(find brouter-server/build/libs -maxdepth 1 -type f -name 'brouter-*-ro.jar' | head -n 1)"
          test -s "$JAR"
          mkdir -p "$GITHUB_WORKSPACE/ali-car-system/app/libs"
          cp "$JAR" "$GITHUB_WORKSPACE/ali-car-system/app/libs/brouter-1.7.10-ro.jar"
          test -s "$GITHUB_WORKSPACE/ali-car-system/app/libs/brouter-1.7.10-ro.jar"

      # Reuse the separately verified Syria package; do not rebuild 180 MB of OSM data
      # during every Android code change.
      - name: Download durable Syria offline map package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p offline-map-artifact
          if gh release view ali-car-offline-maps-v1 >/dev/null 2>&1; then
            gh release download ali-car-offline-maps-v1 --pattern 'ALI-CAR-SYRIA-OFFLINE-MAPS.zip' --dir offline-map-artifact
          else
            gh run download 43502967636 --name ALI-CAR-SYRIA-OFFLINE-MAPS --dir offline-map-artifact
          fi
          test -s offline-map-artifact/ALI-CAR-SYRIA-OFFLINE-MAPS.zip
          echo "92c9eb0552beafb639915e489ea250fd6a44e359f714616445f4c2355e9373c8  offline-map-artifact/ALI-CAR-SYRIA-OFFLINE-MAPS.zip" | sha256sum --check -

      - name: Publish permanent offline map source if this is the first build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view ali-car-offline-maps-v1 >/dev/null 2>&1; then
            gh release create ali-car-offline-maps-v1 offline-map-artifact/ALI-CAR-SYRIA-OFFLINE-MAPS.zip --title "ALI CAR - Verified Syria Offline Maps v1" --notes "Immutable source bundle for ALI CAR API21 builds. Includes Syria vector map, local POI database and BRouter tiles. SHA-256: 92c9eb0552beafb639915e489ea250fd6a44e359f714616445f4c2355e9373c8"
          fi

      - name: Install Syria map, POI database and offline routing assets in APK
        run: |
          set -euo pipefail
          PACKAGE="offline-map-artifact/ALI-CAR-SYRIA-OFFLINE-MAPS.zip"
          test -s "$PACKAGE"
          mkdir -p ali-car-system/app/src/main/assets/offline
          unzip -q "$PACKAGE" -d ali-car-system/app/src/main/assets/offline
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path("ali-car-system/app/src/main/assets/offline")
          required = [
              "syria.map", "syria-places.sqlite",
              "brouter/segments4/E35_N30.rd5", "brouter/segments4/E35_N35.rd5",
              "brouter/segments4/E40_N30.rd5", "brouter/segments4/E40_N35.rd5",
              "brouter/profiles2/car-fast.brf", "brouter/profiles2/lookups.dat",
          ]
          lines = []
          for relative in required:
              path = root / relative
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f"Required offline asset missing: {relative}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest} {path.stat().st_size} {relative}")
          (root / "manifest.sha256").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Generated verified offline SHA-256 manifest for", len(lines), "files")
          PY
          for path in \
            "syria.map" \
            "syria-places.sqlite" \
            "brouter/segments4/E35_N30.rd5" \
            "brouter/segments4/E35_N35.rd5" \
            "brouter/segments4/E40_N30.rd5" \
            "brouter/segments4/E40_N35.rd5" \
            "brouter/profiles2/car-fast.brf" \
            "brouter/profiles2/lookups.dat" \
            "manifest.sha256"; do
              test -s "ali-car-system/app/src/main/assets/offline/$path"
          done
          du -sh ali-car-system/app/src/main/assets/offline

      - name: Remove obsolete historical tracks and enforce local music policy
        run: python tools/rom/install_open_music.py

      - name: Resize and verify dashboard photo
        run: python tools/rom/materialize_dashboard_asset.py

      - name: Verify static contracts
        run: python tools/rom/test_clean_rebuild.py

      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Install Android platform and emulator
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-21;default;x86'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Run unit tests and assemble
        working-directory: ali-car-system
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug assembleAndroidTest

      - name: Verify APK package, API levels, signature and offline payload
        shell: bash
        run: |
          set -euo pipefail
          APK="ali-car-system/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.ali.carsystem'" apk-badging.txt
          grep -F "sdkVersion:'21'" apk-badging.txt
          grep -F "targetSdkVersion:'22'" apk-badging.txt
          grep -F "versionName='3.12.0'" apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee apk-signature.txt
          EXPECTED_CERT="d87a5c149b9cbe6507672cdba137281f78d35941c527b88d925b0a0d4b1842f4"
          grep -i -F "$EXPECTED_CERT" apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$APK" | grep -F "assets/offline/syria.map"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$APK" | grep -F "assets/offline/syria-places.sqlite"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$APK" | grep -F "assets/offline/brouter/segments4/E40_N35.rd5"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$APK" | grep -F "assets/mapsforge/ali-car-dark.xml"
          mkdir -p output
          cp "$APK" output/ALI-Car-System-3.12.0-api21-x86-debug.apk
          (cd output && sha256sum ALI-Car-System-3.12.0-api21-x86-debug.apk > SHA256SUMS.txt)
          cp ali-car-system/INSTALL-MIGRATION-3.12.0.md output/INSTALL-MIGRATION-3.12.0.md
          {
            echo "Project: ALI CAR"
            echo "Package: com.ali.carsystem"
            echo "Version: 3.12.0"
            echo "Device baseline: ASUS Z170CG / P01Y, Intel SoFIA 3GR, x86 32-bit"
            echo "Minimum Android: 5.0 / API 21"
            echo "Target SDK: 22"
            echo "Offline coverage: Syria OSM vector map, local POIs and BRouter driving segments"
            echo "Build type: Debug-signed testing APK using fixed public test-only certificate"
            echo "Signing certificate SHA-256: D87A5C149B9CBE6507672CDBA137281F78D35941C527B88D925B0A0D4B1842F4"
            echo "Commit: $GITHUB_SHA"
            stat --printf='APK bytes: %s\n' output/ALI-Car-System-3.12.0-api21-x86-debug.apk
            cat output/SHA256SUMS.txt
          } > output/BUILD-INFO.txt

      - name: Upload APK and metadata
        uses: actions/upload-artifact@v7
        with:
          name: ALI-CAR-3.12.0-API21-X86-APK
          path: |
            output/ALI-Car-System-3.12.0-api21-x86-debug.apk
            output/SHA256SUMS.txt
            output/BUILD-INFO.txt
            output/INSTALL-MIGRATION-3.12.0.md
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Create writable API21 emulator SD card
        run: |
          "$ANDROID_HOME/emulator/mksdcard" 2G /tmp/ali-car-sdcard.img

      - name: Run API21 x86 UI smoke test
        id: api21-ui-test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 21
          target: default
          arch: x86
          profile: Nexus 7
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics -partition-size 4096 -sdcard /tmp/ali-car-sdcard.img
          disable-animations: true
          working-directory: ali-car-system
          script: |
            set +e
            mkdir -p emulator-diagnostics/screenshots
            adb shell dumpsys battery > emulator-diagnostics/battery-before-tests.txt 2>&1
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            adb shell wm size 1024x600 > emulator-diagnostics/display-size.txt 2>&1
            adb shell wm density 170 > emulator-diagnostics/display-density.txt 2>&1
            adb shell wm size >> emulator-diagnostics/display-size.txt 2>&1
            adb shell wm density >> emulator-diagnostics/display-density.txt 2>&1
            grep -q "1024x600" emulator-diagnostics/display-size.txt || echo 1 > emulator-diagnostics/exit-code.txt
            grep -q "170" emulator-diagnostics/display-density.txt || echo 1 > emulator-diagnostics/exit-code.txt
            adb shell settings put system font_scale 1.0
            adb install -r app/build/outputs/apk/debug/app-debug.apk || exit 1

            echo "Capture dashboard at 1024x600 / 170 dpi"
            timeout 20s adb shell am force-stop com.ali.carsystem || true
            timeout 30s adb shell am start -W -n com.ali.carsystem/.MainActivity || true
            sleep 8
            adb shell screencap -p /sdcard/ali-car-dashboard.png
            adb pull /sdcard/ali-car-dashboard.png emulator-diagnostics/screenshots/main-dashboard.png

            echo "Capture dashboard at 115 percent system font scale"
            adb shell settings put system font_scale 1.15
            timeout 20s adb shell am force-stop com.ali.carsystem || true
            timeout 30s adb shell am start -W -n com.ali.carsystem/.MainActivity || true
            sleep 6
            adb shell screencap -p /sdcard/ali-car-dashboard-large-font.png
            adb pull /sdcard/ali-car-dashboard-large-font.png emulator-diagnostics/screenshots/main-dashboard-font-scale.png
            adb shell settings put system font_scale 1.0

            echo "Capture local music screen"
            timeout 30s adb shell am start -W -n com.ali.carsystem/.MusicActivity || true
            sleep 3
            adb shell screencap -p /sdcard/ali-car-music.png
            adb pull /sdcard/ali-car-music.png emulator-diagnostics/screenshots/music-screen.png

            echo "Capture settings screen"
            timeout 30s adb shell am start -W -n com.ali.carsystem/.SettingsActivity || true
            sleep 3
            adb shell screencap -p /sdcard/ali-car-settings.png
            adb pull /sdcard/ali-car-settings.png emulator-diagnostics/screenshots/settings-screen.png

            echo "Capture phone and Bluetooth screen"
            timeout 30s adb shell am start -W -n com.ali.carsystem/.PhoneActivity || true
            sleep 3
            adb shell screencap -p /sdcard/ali-car-phone.png
            adb pull /sdcard/ali-car-phone.png emulator-diagnostics/screenshots/phone-bluetooth-screen.png

            echo "Capture device diagnostics screen"
            timeout 30s adb shell am start -W -n com.ali.carsystem/.DeviceDiagnosticsActivity || true
            sleep 3
            adb shell screencap -p /sdcard/ali-car-diagnostics.png
            adb pull /sdcard/ali-car-diagnostics.png emulator-diagnostics/screenshots/device-diagnostics-screen.png

            echo "Capture navigation and inject simulated GPS"
            timeout 30s adb shell am start -W -n com.ali.carsystem/.NavigationActivity || true
            sleep 3
            timeout 15s adb emu geo fix 36.2765 33.5138 || true
            sleep 2
            timeout 15s adb emu geo fix 36.2770 33.5142 || true
            sleep 10
            adb shell screencap -p /sdcard/ali-car-navigation.png
            adb pull /sdcard/ali-car-navigation.png emulator-diagnostics/screenshots/navigation-gps-simulation.png

            echo "Run full API21 instrumentation suite"
            timeout 1500s gradle --no-daemon connectedDebugAndroidTest || echo $? > emulator-diagnostics/exit-code.txt
            test -f emulator-diagnostics/exit-code.txt || echo 0 > emulator-diagnostics/exit-code.txt

            echo "Reinstall and capture final navigation state after instrumentation cleanup"
            adb install -r app/build/outputs/apk/debug/app-debug.apk || echo 1 > emulator-diagnostics/exit-code.txt
            adb shell wm size 1024x600 > emulator-diagnostics/display-size-after-tests.txt 2>&1
            adb shell wm density 170 > emulator-diagnostics/display-density-after-tests.txt 2>&1
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            adb shell settings put system font_scale 1.0
            timeout 20s adb shell am force-stop com.ali.carsystem || true
            timeout 30s adb shell am start -W -n com.ali.carsystem/.NavigationActivity || true
            sleep 12
            timeout 15s adb emu geo fix 36.2765 33.5138 || true
            sleep 2
            adb shell screencap -p /sdcard/ali-car-navigation-final.png
            adb pull /sdcard/ali-car-navigation-final.png emulator-diagnostics/screenshots/navigation-final.png
            adb shell dumpsys gfxinfo com.ali.carsystem > emulator-diagnostics/gfxinfo.txt 2>&1
            adb shell dumpsys meminfo com.ali.carsystem > emulator-diagnostics/meminfo.txt 2>&1
            adb shell dumpsys activity activities > emulator-diagnostics/activities.txt 2>&1
            adb shell dumpsys mount > emulator-diagnostics/storage-mounts.txt 2>&1
            adb devices -l > emulator-diagnostics/adb-devices.txt 2>&1
            adb logcat -d -v time > emulator-diagnostics/logcat.txt 2>&1

            python3 - <<'PY'
            from pathlib import Path
            from PIL import Image
            root = Path("emulator-diagnostics/screenshots")
            required = [
                "main-dashboard.png", "main-dashboard-font-scale.png",
                "music-screen.png", "settings-screen.png",
                "phone-bluetooth-screen.png", "device-diagnostics-screen.png",
                "navigation-gps-simulation.png", "navigation-final.png",
            ]
            for name in required:
                path = root / name
                if not path.is_file():
                    raise SystemExit(f"Missing screenshot: {name}")
                image = Image.open(path)
                print(f"{name}: {image.size[0]}x{image.size[1]}")
                if image.size != (1024, 600):
                    raise SystemExit(f"{name} is not 1024x600 landscape: {image.size}")
            PY
            if grep -E "FATAL EXCEPTION.*com\\.ali\\.carsystem|ANR in com\\.ali\\.carsystem" emulator-diagnostics/logcat.txt; then
              echo 1 > emulator-diagnostics/exit-code.txt
            fi
            if [ -f emulator-diagnostics/exit-code.txt ] && [ "$(cat emulator-diagnostics/exit-code.txt)" != "0" ]; then exit 1; fi
            exit 0

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ALI-CAR-3.12.0-API21-X86-DIAGNOSTICS
          path: ali-car-system/emulator-diagnostics/
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish verified ALI CAR 3.12.0 release
        if: success() && github.ref == 'refs/heads/ali-car-system/3.12.0-full-repair-2026-11-20'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ali-car-v3.12.0-api21-x86"
          ASSETS=(
            output/ALI-Car-System-3.12.0-api21-x86-debug.apk
            output/SHA256SUMS.txt
            output/BUILD-INFO.txt
            output/INSTALL-MIGRATION-3.12.0.md
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "ALI CAR 3.12.0 — Android 5 / x86" --notes-file ali-car-system/RELEASE-NOTES-3.12.0.md --prerelease
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "ALI CAR 3.12.0 — Android 5 / x86" --notes-file ali-car-system/RELEASE-NOTES-3.12.0.md --prerelease --target "$GITHUB_SHA"
          fi
