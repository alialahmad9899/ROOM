name: Build car launcher

on:
  push:
    branches: [main, 'work/**']
    paths:
      - 'car-launcher/**'
      - '.github/workflows/build-car-launcher.yml'
  pull_request:
    paths:
      - 'car-launcher/**'
      - '.github/workflows/build-car-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: car-launcher
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wesal-car-launcher-debug
          path: car-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
