name: Inspect P01Y system apps for ROM debloat

on:
  push:
    branches: ['work/p01y-rom-system-debloat-2026-11-10']
    paths:
      - '.github/workflows/inspect-p01y-system-apps.yml'
      - 'tools/rom/inspect_p01y_system.py'
  pull_request:
    paths:
      - '.github/workflows/inspect-p01y-system-apps.yml'
      - 'tools/rom/inspect_p01y_system.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout ROM tools
        uses: actions/checkout@v4

      - name: Install ext filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs

      - name: Set up Android build tools for APK manifest inspection
        uses: android-actions/setup-android@v3
      - name: Install aapt
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Download and verify original ASUS OTA
        env:
          DOWNLOAD_URL: https://github.com/alialahmad9899/ROOM/releases/download/stock-firmware-v1/UL-P01Y-WW-12.26.4.69-user_2.zip
          EXPECTED_SHA256: a3cff1f6703cb68cbe189fc029ab0a94fd7a3ab85297cfdd271fe3e7ff16a6a2
          EXPECTED_SIZE: '1121160179'
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, urllib.request
          path = pathlib.Path('stock-firmware-original.zip')
          request = urllib.request.Request(os.environ['DOWNLOAD_URL'], headers={'User-Agent':'ROOM-P01Y-ROM-builder'})
          digest = hashlib.sha256()
          size = 0
          with urllib.request.urlopen(request, timeout=600) as response, path.open('wb') as out:
              while True:
                  chunk = response.read(4 * 1024 * 1024)
                  if not chunk:
                      break
                  out.write(chunk)
                  digest.update(chunk)
                  size += len(chunk)
          if size != int(os.environ['EXPECTED_SIZE']):
              raise SystemExit(f'Wrong OTA size: {size}')
          if digest.hexdigest() != os.environ['EXPECTED_SHA256']:
              raise SystemExit(f'Wrong OTA SHA256: {digest.hexdigest()}')
          print(f'Original OTA verified: {size} bytes; SHA256={digest.hexdigest()}')
          PY

      - name: Reconstruct system and enumerate installed APK manifests
        run: |
          python3 tools/rom/inspect_p01y_system.py \
            --archive stock-firmware-original.zip \
            --out p01y-system-inventory

      - name: Upload system APK inventory (no firmware image)
        uses: actions/upload-artifact@v4
        with:
          name: p01y-system-apk-inventory
          path: |
            p01y-system-inventory/system-apk-inventory.csv
            p01y-system-inventory/system-build.prop
            p01y-system-inventory/system-root-listing.txt
            p01y-system-inventory/system-inventory-report.txt
          if-no-files-found: error
          retention-days: 30
