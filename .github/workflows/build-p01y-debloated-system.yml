name: Build P01Y WW debloated system candidate

on:
  push:
    branches: ["rom/**", "ali-car-system/**"]
    paths:
      - ".github/workflows/build-p01y-debloated-system.yml"
      - "tools/rom/build_modified_system.py"
      - "tools/rom/create_bootanimation.py"
      - "ali-car-system/**"
      - "tools/rom/debloat/**"
      - "docs/P01Y-WW-ROM-CANDIDATE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-system-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout ROM tools
        uses: actions/checkout@v4

      - name: Install filesystem and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs zip attr python3-pil fonts-dejavu-core

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate ROM tooling syntax
        run: python3 -m py_compile tools/rom/reconstruct_system.py tools/rom/inventory_system.py tools/rom/audit_candidate_manifests.py tools/rom/build_modified_system.py tools/rom/create_bootanimation.py

      - name: Build ALI Car System for Android 5
        working-directory: ali-car-system
        run: gradle --no-daemon assembleDebug

      - name: Verify ALI app and create boot animation
        run: |
          set -euo pipefail
          APK="ali-car-system/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.ali.carsystem'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p workspace/rom-output
          cp "$APK" workspace/rom-output/ALICarSystem.apk
          python3 tools/rom/create_bootanimation.py
          test -s workspace/rom-output/bootanimation.zip

      - name: Download and reconstruct exact stock P01Y WW system
        env:
          OTA_URL: https://github.com/alialahmad9899/ROOM/releases/download/stock-firmware-v1/UL-P01Y-WW-12.26.4.69-user_2.zip
        run: |
          set -euo pipefail
          mkdir -p workspace/system-mount workspace/inventory workspace/rom-output
          curl --fail --location --retry 3 --retry-delay 2 "$OTA_URL" -o workspace/stock-ota-original.zip
          python3 tools/rom/reconstruct_system.py --archive workspace/stock-ota-original.zip --output workspace/system.img
          cp workspace/system.img.sha256 workspace/rom-output/stock-system.img.sha256

      - name: Inventory stock packages, apply debloat and install ALI system app
        run: |
          set -euo pipefail
          sudo mount -t ext4 -o loop,rw workspace/system.img workspace/system-mount
          cleanup() {
            sudo umount workspace/system-mount || true
          }
          trap cleanup EXIT
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          python3 tools/rom/inventory_system.py --system-root workspace/system-mount --aapt "$AAPT" --output-dir workspace/inventory
          python3 tools/rom/audit_candidate_manifests.py --system-root workspace/system-mount --inventory workspace/inventory/system-package-inventory.json --candidate-list tools/rom/candidates/potential-removals.txt --aapt "$AAPT" --output-dir workspace/inventory/candidate-audit
          sudo python3 tools/rom/build_modified_system.py \
            --system-root workspace/system-mount \
            --system-image workspace/system.img \
            --inventory workspace/inventory/system-package-inventory.json \
            --candidate-audit workspace/inventory/candidate-audit/candidate-manifest-audit.json \
            --manifest tools/rom/debloat/p01y-ww-removals.json \
            --launcher-apk workspace/rom-output/ALICarSystem.apk \
            --bootanimation workspace/rom-output/bootanimation.zip \
            --aapt "$AAPT" \
            --output-dir workspace/rom-output
          mkdir -p workspace/rom-output/audit
          cp workspace/inventory/system-package-inventory.csv workspace/rom-output/audit/
          cp workspace/inventory/candidate-audit/candidate-manifest-audit.csv workspace/rom-output/audit/
          sync
          sudo umount workspace/system-mount
          trap - EXIT

      - name: Verify and shrink ext4 system image
        run: |
          set -euo pipefail
          set +e
          sudo e2fsck -f -y workspace/system.img
          FSCK_REPAIR_RC=$?
          set -e
          if [ "$FSCK_REPAIR_RC" -gt 1 ]; then
            echo "e2fsck repair failed with exit code $FSCK_REPAIR_RC"
            exit "$FSCK_REPAIR_RC"
          fi
          sudo e2fsck -f -n workspace/system.img
          sudo resize2fs -M workspace/system.img
          BLOCKS="$(sudo dumpe2fs -h workspace/system.img 2>/dev/null | awk '/^Block count:/ {print $3}')"
          BLOCK_SIZE="$(sudo dumpe2fs -h workspace/system.img 2>/dev/null | awk '/^Block size:/ {print $3}')"
          test -n "$BLOCKS"
          test -n "$BLOCK_SIZE"
          FS_BYTES="$((BLOCKS * BLOCK_SIZE))"
          truncate -s "$FS_BYTES" workspace/system.img
          # Minimum resize can leave the ext4 resize inode needing one metadata correction.
          # Repair it explicitly, then require a clean read-only check before packaging.
          set +e
          sudo e2fsck -f -y workspace/system.img
          FINAL_REPAIR_RC=$?
          set -e
          if [ "$FINAL_REPAIR_RC" -gt 1 ]; then
            echo "Post-resize e2fsck repair failed with exit code $FINAL_REPAIR_RC"
            exit "$FINAL_REPAIR_RC"
          fi
          sudo e2fsck -f -n workspace/system.img
          test "$FS_BYTES" -le 2415919104
          cp workspace/system.img workspace/rom-output/system.img
          sha256sum workspace/rom-output/system.img > workspace/rom-output/system.img.sha256
          sudo python3 tools/rom/finalize_system_candidate.py --output-dir workspace/rom-output
          stat --printf='system_image_bytes=%s\n' workspace/rom-output/system.img > workspace/rom-output/system-image-size.txt
          {
            echo "P01Y WW candidate only"
            echo "Filesystem bytes: $FS_BYTES"
            echo "Reference system partition ceiling: 2415919104 bytes (must still be checked on the actual tablet)"
            echo "Bootloader / dm-verity: NOT YET VERIFIED"
          } > workspace/rom-output/FLASH-STATUS.txt
          cp docs/P01Y-WW-ROM-CANDIDATE.md workspace/rom-output/README-FLASH-RESTRICTIONS.md
          rm -f workspace/system.img workspace/stock-ota-original.zip

      - name: Verify modified system contents read-only
        run: |
          set -euo pipefail
          mkdir -p workspace/verify-mount
          sudo mount -t ext4 -o loop,ro,noload workspace/rom-output/system.img workspace/verify-mount
          cleanup() {
            sudo umount workspace/verify-mount || true
          }
          trap cleanup EXIT
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          python3 tools/rom/verify_system_candidate.py --system-root workspace/verify-mount --inventory workspace/inventory/system-package-inventory.json --manifest tools/rom/debloat/p01y-ww-removals.json --report workspace/rom-output/ROM-MODIFICATIONS.json --backup-archive workspace/rom-output/removed-system-apps.tar.gz --aapt "$AAPT" --output workspace/rom-output/CANDIDATE-VERIFICATION.json
          sudo umount workspace/verify-mount
          trap - EXIT

      - name: Split system image into verified-download chunks
        run: |
          set -euo pipefail
          mkdir -p workspace/rom-output/chunks
          split -b 400M -d -a 2 workspace/rom-output/system.img workspace/rom-output/chunks/system.img.part-
          PARTS="$(find workspace/rom-output/chunks -maxdepth 1 -type f -name 'system.img.part-*' | wc -l)"
          test "$PARTS" -eq 5
          ORIGINAL_HASH="$(sha256sum workspace/rom-output/system.img | awk '{print $1}')"
          CHUNKS_HASH="$(cat workspace/rom-output/chunks/system.img.part-* | sha256sum | awk '{print $1}')"
          printf '%s  system.img\n' "$ORIGINAL_HASH" > workspace/rom-output/chunks/ORIGINAL.sha256
          printf '%s  reassembled\n' "$CHUNKS_HASH" > workspace/rom-output/chunks/REASSEMBLED.sha256
          test "$ORIGINAL_HASH" = "$CHUNKS_HASH"

      - name: Upload system image part 00
        uses: actions/upload-artifact@v4
        with:
          name: P01Y-WW-system-img-part-00
          path: workspace/rom-output/chunks/system.img.part-00
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload system image part 01
        uses: actions/upload-artifact@v4
        with:
          name: P01Y-WW-system-img-part-01
          path: workspace/rom-output/chunks/system.img.part-01
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload system image part 02
        uses: actions/upload-artifact@v4
        with:
          name: P01Y-WW-system-img-part-02
          path: workspace/rom-output/chunks/system.img.part-02
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload system image part 03
        uses: actions/upload-artifact@v4
        with:
          name: P01Y-WW-system-img-part-03
          path: workspace/rom-output/chunks/system.img.part-03
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload system image part 04
        uses: actions/upload-artifact@v4
        with:
          name: P01Y-WW-system-img-part-04
          path: workspace/rom-output/chunks/system.img.part-04
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload ROM reports, launcher and rollback archive
        uses: actions/upload-artifact@v4
        with:
          name: P01Y-WW-ROM-reports-and-rollback
          path: |
            workspace/rom-output/removed-system-apps.tar.gz
            workspace/rom-output/original-configs/
            workspace/rom-output/ROM-MODIFICATIONS.json
            workspace/rom-output/CANDIDATE-VERIFICATION.json
            workspace/rom-output/system.img.sha256
            workspace/rom-output/system-image-size.txt
            workspace/rom-output/FLASH-STATUS.txt
            workspace/rom-output/README-FLASH-RESTRICTIONS.md
            workspace/rom-output/ALICarSystem.apk
            workspace/rom-output/bootanimation.zip
            workspace/rom-output/config-changes.patch
            workspace/rom-output/audit/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
