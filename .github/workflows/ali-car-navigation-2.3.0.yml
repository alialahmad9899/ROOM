name: ALI CAR Navigation 2.3.0

on:
  push:
    branches:
      - "ali-car-system/2.3.0-navigation-overhaul-2026-11-13"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ali-car-system
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK metadata and signature
        working-directory: ali-car-system
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.ali.carsystem' versionCode='14' versionName='2.3.0'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p artifacts
          sha256sum "$APK" | tee artifacts/ALI-CAR-2.3.0-SHA256.txt
          cp "$APK" artifacts/ALI-CAR-2.3.0-API21-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALI-CAR-2.3.0-API21-APK
          path: ali-car-system/artifacts/
          if-no-files-found: error
